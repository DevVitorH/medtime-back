spring.application.name=viverbem-api
server.port=8080
# PostgreSQL (para MySQL: troque a URL para jdbc:mysql://localhost:3306/viverbem e o driver no pom.xml)
spring.datasource.url=jdbc:postgresql://localhost:5432/viverbem
spring.datasource.username=${DB_USER:postgres}
# Senha só por variável de ambiente (nunca no Git): defina DB_PASSWORD antes de subir a API.
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.origins=http://localhost:8081
# A chave da IA fica SOMENTE no servidor (variável de ambiente), nunca no app.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
