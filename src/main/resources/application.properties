spring.application.name=viverbem-api
# Lê as variáveis do arquivo .env na pasta medtime-back (se existir). O .env NÃO vai para o Git.
# Variáveis definidas no sistema (PowerShell, VS Code) têm prioridade sobre o .env.
spring.config.import=optional:file:./.env[.properties]
server.port=8080
# PostgreSQL (para MySQL: troque a URL para jdbc:mysql://localhost:3306/viverbem e o driver no pom.xml)
spring.datasource.url=jdbc:postgresql://localhost:5432/viverbem
spring.datasource.username=${DB_USER:postgres}
# Senha só no .env ou em variável de ambiente (nunca no Git).
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.origins=http://localhost:8081
# A chave da IA fica SOMENTE no servidor (variável de ambiente), nunca no app.
# Assistente: API do Google Gemini (plano gratuito). Chave criada no Google AI Studio.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
